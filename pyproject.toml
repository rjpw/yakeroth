[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yakeroth"
version = "0.4.2"
description = "AzerothCore server composition manager — declarative modules, git-versioned sites, coupled image/DB schema"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.0",
    "gitpython>=3.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
]
optional-dependencies = {dev = ["pytest>=8.0", "pytest-mock>=3.12", "ruff>=0.4", "mypy>=1.8"]}

[project.scripts]
yakeroth = "yakeroth.cli:main"

[project.urls]
Homepage = "https://github.com/rjpw/yakeroth"
Repository = "https://github.com/rjpw/yakeroth"
Issues = "https://github.com/rjpw/yakeroth/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["yakeroth*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]
lint.ignore = ["S101", "PTH118", "PTH123"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"